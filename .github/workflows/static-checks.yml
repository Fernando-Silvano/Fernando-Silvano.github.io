name: Static checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify repository entry point and documentation
        shell: bash
        run: |
          test -s index.html
          test -s README.md
          test -s LICENSE
          test -s CONTRIBUTING.md
          test -s SECURITY.md
          ! grep -R -nE '(AKIA[0-9A-Z]{16}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----)' --include='*.html' --include='*.js' --include='*.md' . 
      - name: Check basic HTML structure
        shell: python
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path("index.html").read_text(encoding="utf-8")
          assert "<html" in text.lower(), "missing html element"
          assert "</html>" in text.lower(), "missing html closing tag"
          assert "<title" in text.lower(), "missing document title"
          print("Entry point and basic document structure verified")
          PY
